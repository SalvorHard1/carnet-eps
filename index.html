<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- Verrou réseau : l'appli ne peut parler qu'à son propre serveur (pour vérifier sa version) et ne peut rien envoyer ailleurs. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; form-action 'none'; base-uri 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EPS S-A">
  <title>Carnet EPS S-A</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="maj" class="bandeau" hidden>
    Une nouvelle version de l’appli est prête.
    <button id="btn-maj" class="primaire">Recharger</button>
  </div>

  <header class="barre">
    <button class="icone" data-action="menu" id="btn-menu" aria-label="Classes">☰</button>
    <h1>Carnet EPS <span class="titre-etab">S-A</span></h1>
    <button class="version-appli" id="version-appli" data-action="maj-appli"></button>
    <nav class="onglets" id="onglets">
      <button data-vue="eleves">Élèves</button>
      <button data-vue="notes">Notes</button>
      <button data-vue="entrainement"><span class="libelle-long">Entraînement</span><span class="libelle-court">Entraîn.</span></button>
    </nav>
    <div class="groupe-sauvegarde">
      <!-- Un seul bouton pour tout ce qui touche à la clé : sa couleur donne l'état, il ouvre le menu de la clé. -->
      <button class="sauver" id="btn-sauver" data-action="cle" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-cle">
        <span class="sauver-icone" aria-hidden="true">🔑</span><span id="etat-cle">Ma clé</span>
      </button>
    </div>
  </header>

  <!-- Menu de la clé : les deux gestes, et l'aide en dessous. -->
  <div class="menu-cle" id="menu-cle" role="menu" hidden>
    <p class="menu-cle-etat" id="menu-cle-etat"></p>
    <button class="choix-cle" data-menu-cle="recuperer" role="menuitem">
      <span class="choix-icone" aria-hidden="true">⬇</span>
      <span class="choix-texte"><b>Récupérer depuis la clé</b><small>En arrivant sur cet appareil</small></span>
    </button>
    <label class="bouton choix-cle" data-menu-cle-fichier role="menuitem">
      <span class="choix-icone" aria-hidden="true">⬇</span>
      <span class="choix-texte"><b>Récupérer depuis la clé</b><small>Choisis carnet-eps.json sur la clé</small></span>
      <input type="file" accept=".json,application/json" data-importer hidden>
    </label>
    <button class="choix-cle primaire" data-menu-cle="enregistrer" role="menuitem">
      <span class="choix-icone" aria-hidden="true">⬆</span>
      <span class="choix-texte"><b>Enregistrer sur la clé</b><small>En partant</small></span>
    </button>
    <button class="lien menu-cle-aide" data-menu-cle="aide" role="menuitem">Aide et dépannage…</button>
  </div>

  <div class="corps">
    <aside class="classes" id="classes">
      <div class="classes-titre">Classes</div>
      <ul id="liste-classes"></ul>
      <p class="aide astuce-classes" id="astuce-classes" hidden>Appui long sur une classe pour la déplacer.</p>
      <button class="ajout" data-action="ajout-classe">+ Nouvelle classe</button>
    </aside>
    <div class="voile" id="voile" data-action="menu" hidden></div>
    <main id="vue"></main>
    <!-- Ascenseur (écran tactile) : curseur fin à droite, à faire glisser pour parcourir la page. -->
    <div class="ascenseur" id="ascenseur" aria-hidden="true" hidden><div class="ascenseur-curseur"></div></div>
  </div>

  <div class="saisie" id="saisie" hidden>
    <button data-code="ABS" class="code-ABS">Absent</button>
    <button data-code="DISP" class="code-DISP">Dispensé</button>
    <button data-code="NE" class="code-NE notes-seul">Non noté</button>
    <button data-code="BLE" class="code-BLE ent-seul">Blessé</button>
    <button data-code="MAL" class="code-MAL ent-seul">Malade</button>
    <button data-code="AUT" class="code-AUT ent-seul">Autre</button>
    <button data-code="">Effacer</button>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <div class="notif-auto" id="notif-auto" role="status" hidden></div>

  <script src="donnees.js"></script>
  <script src="cle.js"></script>
  <script src="referentiel.js"></script>
  <script src="tableur.js"></script>
  <script src="entrainement.js"></script>
  <script src="listeclasse.js"></script>
  <script src="app.js"></script>
</body>
</html>
