<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- Verrou réseau : l'appli ne peut parler qu'à son propre serveur (pour vérifier sa version) et ne peut rien envoyer ailleurs. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; form-action 'none'; base-uri 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EPS S-A">
  <title>Carnet EPS S-A</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.ico" sizes="16x16 32x32 48x48 256x256">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="maj" class="bandeau" hidden>
    Une nouvelle version de l’appli est prête.
    <button id="btn-maj" class="primaire">Recharger</button>
  </div>

  <header class="barre">
    <button class="icone" data-action="menu" id="btn-menu" aria-label="Classes">☰</button>
    <h1>Carnet EPS <span class="titre-etab">S-A</span></h1>
    <button class="version-appli" id="version-appli" data-action="maj-appli"></button>
    <nav class="onglets" id="onglets">
      <button data-vue="eleves">Élèves</button>
      <button data-vue="appel">Appel</button>
      <button data-vue="notes">Notes</button>
      <button data-vue="entrainement">Leçons</button>
      <button data-vue="outils">Outils</button>
      <button data-vue="agenda">Agenda</button>
      <button data-vue="baremes">Barèmes</button>
      <button data-vue="pp" hidden>Prof principal</button>
    </nav>
    <!-- Tablette : onglets regroupés en rideaux, ou favoris + « Plus » (onglets.js) -->
    <nav class="onglets-compact" id="onglets-compact" aria-label="Onglets" hidden></nav>
    <button class="icone btn-verrou" id="btn-cache-ecran" type="button" title="Cacher les infos sensibles (F8)" aria-label="Cacher les infos sensibles" aria-pressed="false"><svg class="bouclier-infos" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a12 12 0 0 0 8.5 3a12 12 0 0 1 -8.5 15a12 12 0 0 1 -8.5 -15a12 12 0 0 0 8.5 -3"/><g class="serrure-infos"><circle cx="12" cy="11" r="1"/><path d="M12 12v2.5"/></g></svg></button>
    <!-- Carnet École : roue des réglages du carnet, visible depuis tous les onglets (cachée ailleurs : style.css). -->
    <button class="icone btn-verrou" id="btn-reglages-barre" type="button" data-action="reglages" title="Réglages du carnet" aria-label="Réglages du carnet"><svg class="roue-reglages" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 4.3c.4-1.8 3-1.8 3.4 0a1.7 1.7 0 0 0 2.6 1.1c1.5-.9 3.3.8 2.4 2.4a1.7 1.7 0 0 0 1 2.5c1.8.4 1.8 3 0 3.4a1.7 1.7 0 0 0-1 2.6c.9 1.5-.9 3.3-2.4 2.4a1.7 1.7 0 0 0-2.6 1c-.4 1.8-3 1.8-3.4 0a1.7 1.7 0 0 0-2.6-1c-1.5.9-3.3-.9-2.4-2.4a1.7 1.7 0 0 0-1-2.6c-1.8-.4-1.8-3 0-3.4a1.7 1.7 0 0 0 1-2.5c-.9-1.6.9-3.3 2.4-2.4a1.7 1.7 0 0 0 2.6-1.1z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button class="icone btn-verrou" id="btn-verrou" title="Verrouiller le carnet maintenant" aria-label="Verrouiller le carnet" hidden>🔒</button>
    <div class="groupe-sauvegarde">
      <!-- ↶ Retour en arrière / ↷ retour vers l'avant (donnees.js › annuler, refaire). -->
      <button class="btn-annuler" id="btn-annuler" data-action="annuler" title="Rien à annuler pour l’instant" aria-label="Revenir en arrière" disabled>↶</button>
      <button class="btn-annuler" id="btn-refaire" data-action="refaire" title="Rien à refaire pour l’instant" aria-label="Retour vers l’avant" disabled>↷</button>
      <!-- Un seul bouton pour tout ce qui touche à la clé : sa couleur donne l'état, il ouvre le menu de la clé. -->
      <button class="sauver" id="btn-sauver" data-action="cle" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-cle">
        <span class="sauver-icone" aria-hidden="true">💾</span><span id="etat-cle">Enregistrer</span>
      </button>
    </div>
  </header>

  <!-- Menu « Enregistrer » : l'état, « Enregistrer / Récupérer » (sur tablette : deux boutons côte à côte), puis
       les trois endroits (Drive, clé, ordinateur : celui choisi sur cet appareil est coloré), l'aide.
       Les textes suivent l'endroit choisi (app.js › ouvrirMenuCle). -->
  <div class="menu-cle" id="menu-cle" role="menu" hidden>
    <p class="menu-cle-etat" id="menu-cle-etat"></p>
    <button type="button" class="menu-cle-deplace" data-menu-cle="deplace" role="menuitem" hidden>✔ C’est fait</button>
    <div class="gestes-cle">
      <button class="choix-cle primaire" data-menu-cle="enregistrer" role="menuitem">
        <span class="choix-icone" aria-hidden="true">⇅</span>
        <span class="choix-texte"><b data-menu-texte="enregistrer">Enregistrer / Récupérer</b><small></small></span>
      </button>
      <label class="bouton choix-cle primaire" data-menu-cle-fichier role="menuitem">
        <span class="choix-icone" aria-hidden="true">⬇</span>
        <span class="choix-texte"><b data-menu-texte="recuperer">Récupérer</b><small>Choisis les <b>.json</b>, un ou plusieurs</small></span>
        <input type="file" accept=".json,application/json" multiple data-importer hidden>
      </label>
    </div>
    <div class="endroits-cle" role="group" aria-label="Endroit d’enregistrement sur cet appareil">
      <button type="button" class="endroit-cle" data-menu-endroit="drive" aria-pressed="false"><span aria-hidden="true">☁</span>Drive</button>
      <button type="button" class="endroit-cle" data-menu-endroit="cle" aria-pressed="false"><span aria-hidden="true">🔑</span>Clé</button>
      <button type="button" class="endroit-cle" data-menu-endroit="dossier" aria-pressed="false"><span aria-hidden="true" data-menu-texte="icone-dossier">💻</span><span data-menu-texte="dossier">Ordinateur</span></button>
    </div>
    <p class="menu-cle-couple" id="menu-cle-couple" hidden></p>
    <p class="forme-sauvegarde" id="menu-cle-forme"></p>
    <button class="lien menu-cle-aide" data-menu-cle="aide" role="menuitem">Aide et dépannage…</button>
  </div>

  <div class="corps">
    <aside class="classes" id="classes">
      <div class="recherche-eleve">
        <input id="recherche-eleve" type="search" placeholder="🔍 Rechercher un élève" autocomplete="off" spellcheck="false"
          aria-label="Rechercher un élève dans toutes les classes" aria-controls="resultats-recherche" title="Raccourci : / ou Ctrl+K">
        <ul id="resultats-recherche" class="resultats-recherche" role="listbox" hidden></ul>
      </div>
      <div class="classes-titre">Classes</div>
      <ul id="liste-classes"></ul>
      <p class="aide astuce-classes" id="astuce-classes" hidden>Appui long sur une classe pour la déplacer.</p>
      <button class="ajout" data-action="ajout-classe">+ Nouvelle classe</button>
      <button class="bouton-reglages" data-action="reglages" title="Couleurs, établissement, notes, compétences, onglets…">⚙ Réglages du carnet</button>
    </aside>
    <div class="voile" id="voile" data-action="menu" hidden></div>
    <main id="vue"></main>
    <!-- Ascenseur (écran tactile) : curseur fin à droite, à faire glisser pour parcourir la page. -->
    <div class="ascenseur" id="ascenseur" aria-hidden="true" hidden><div class="ascenseur-curseur"></div></div>
  </div>

  <!-- Tablette : onglets en bas de l'écran, si choisi dans les réglages (onglets.js) -->
  <nav class="onglets-bas" id="onglets-bas" aria-label="Onglets" hidden></nav>

  <div class="saisie" id="saisie" hidden>
    <button data-code="ABS" class="code-ABS">Absent</button>
    <button data-code="NR" class="code-NR" hidden>Non rendu</button>
    <button data-code="DISP" class="code-DISP">Dispensé</button>
    <button data-code="NE" class="code-NE notes-seul">Non noté</button>
    <button data-code="BLE" class="code-BLE">Blessé</button>
    <button data-code="MAL" class="code-MAL">Malade</button>
    <button data-code="TEN" class="code-TEN ent-seul">Oubli tenue</button>
    <button data-code="AUT" class="code-AUT">Autre</button>
    <button data-code="">Effacer</button>
  </div>

  <div class="toast" id="toast" role="status" popover="manual" hidden></div>  <div class="notif-auto" id="notif-auto" role="status" hidden></div>

  <script src="compat.js"></script>
  <script src="donnees.js"></script>
  <script src="discipline.js"></script>
  <script src="cle.js"></script>
  <script src="enregistrement.js"></script>
  <script src="referentiel.js"></script>
  <script src="tableur.js"></script>
  <script src="entrainement.js"></script>
  <script src="notesexcel.js"></script>
  <script src="versecoledirecte.js"></script>
  <script src="listeclasse.js"></script>
  <script src="reglages.js"></script>
  <script src="perso.js"></script>
  <script src="onglets.js"></script>
  <script src="outils.js"></script>
  <script src="combine.js"></script>
  <script src="natation.js"></script>
  <script src="asns.js"></script>
  <script src="videodelay.js"></script>
  <script src="tableau.js"></script>
  <script src="boxe.js"></script>
  <script src="volley.js"></script>
  <script src="volleysituations.js"></script>
  <script src="ece.js"></script>
  <script src="ecepc.js"></script>
  <script src="labo.js"></script>
  <script src="tp.js"></script>
  <script src="edtpdf.js"></script>
  <script src="trombiimage.js"></script>
  <script src="trombi.js"></script>
  <script src="agenda.js"></script>
  <script src="fichenotes.js"></script>
  <script src="bilansvt.js"></script>
  <script src="eleves.js"></script>
  <script src="appel.js"></script>
  <script src="exemple.js"></script>
  <script src="dessinpdf.js"></script>
  <script src="ecole.js"></script>
  <script src="ecoleoutils.js"></script>
  <script src="ecoleclasse.js"></script>
  <script src="appreciations.js"></script>
  <script src="bilanpp.js"></script>
  <script src="pp.js"></script>
  <script src="ppinfos.js"></script>
  <script src="baremes.js"></script>
  <script src="importbareme.js"></script>
  <script src="apprendrebareme.js"></script>
  <script src="choixdegre.js"></script>
  <script src="verrou.js"></script>
  <script src="cacheecran.js"></script>
  <script src="aide.js"></script>
  <script src="ecoleaide.js"></script>
  <script src="extensions.js"></script>
  <script src="app.js"></script>
</body>
</html>
